name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".editorconfig"
      - ".vscode/**"
      - ".github/**"
      - "!.github/workflows/**"
      - "content/**"
      - "public/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".editorconfig"
      - ".vscode/**"
      - ".github/**"
      - "!.github/workflows/**"
      - "content/**"
      - "public/**"

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NODE_NO_WARNINGS: 1
